name: Handler Tests (bpy 5.1 / 5.2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  handler-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bpy-version: ["5.1.0", "5.2.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bpy==${{ matrix.bpy-version }}
          pip install pytest pytest-cov

      - name: Run handler tests
        run: pytest tests/test_addon/test_handlers/ -v --tb=short

      - name: Run relighting save/reopen integration
        if: matrix.bpy-version == '5.2.0'
        run: python tests/integration/run_relighting_bpy_integration.py

      - name: Run full test suite
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short
